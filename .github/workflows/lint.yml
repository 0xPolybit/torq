name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ruff format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.3"
          args: "format --check"
      - name: Ruff lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.3"
          args: "check --output-format=github"

  mypy:
    name: mypy strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run mypy
        run: uv run mypy src/torq